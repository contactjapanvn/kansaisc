<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>KSC — Xác nhận đi làm</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <a class="btn btn-ghost btn-sm" href="index.html" data-i18n="backHome">Về trang chủ</a>
        <div style="display: flex; gap: 0.5rem; align-items: center">
          <span id="modeBadge" class="badge demo" data-i18n="demoBadge">Demo</span>
          <div class="lang-switch">
            <button type="button" data-lang="vi" class="active">VI</button>
            <button type="button" data-lang="ja">JP</button>
          </div>
        </div>
      </div>

      <div class="page-head">
        <div>
          <div class="brand-lockup" style="margin-bottom: 0.55rem">
            <div class="logo-mark">KSC</div>
            <div class="brand-text">
              <strong data-i18n="confirmTitle">Xác nhận đi làm</strong>
              <span id="dateLabel">—</span>
            </div>
          </div>
        </div>
      </div>

      <div id="msg" class="alert ok hidden"></div>
      <div id="successBox" class="card hidden" style="text-align: center">
        <div class="success-check">✓</div>
        <h2 data-i18n="confirmOk">Xác nhận thành công!</h2>
        <p class="muted" id="successMeta"></p>
      </div>

      <div class="card">
        <h3 data-i18n="pickShift">Chọn ca làm ngày mai</h3>
        <div id="shiftPick" class="form-grid" style="margin-top: 0.65rem"></div>
      </div>

      <div class="card hidden" id="peopleCard">
        <h3 data-i18n="findMe">Tìm tên của bạn</h3>
        <label class="field" style="margin: 0.65rem 0">
          <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Katakana / mã NV" />
        </label>
        <div id="peopleList" class="emp-list"></div>
      </div>

      <div class="card hidden" id="pinCard">
        <div id="selectedInfo" class="emp-item" style="margin-bottom: 0.85rem"></div>
        <label class="field">
          <span data-i18n="enterPin">Nhập mã cá nhân</span>
          <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="****" />
        </label>
        <button id="confirmBtn" class="btn btn-lg btn-green" style="width: 100%; margin-top: 0.9rem" type="button">
          <span data-i18n="confirmBtn">XÁC NHẬN ĐI LÀM</span>
        </button>
      </div>

      <p class="footer-mini muted">
        Demo PIN: KSC001→1234 · KSC002→2345 · KSC003→3456
      </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/confirm.js"></script>
  </body>
</html>
