<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>KSC — Lịch ngày mai</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <a class="btn btn-ghost btn-sm" href="index.html" data-i18n="backHome">Về trang chủ</a>
        <div style="display: flex; gap: 0.5rem; align-items: center">
          <span id="modeBadge" class="badge demo" data-i18n="demoBadge">Demo</span>
          <div class="lang-switch">
            <button type="button" data-lang="vi" class="active">VI</button>
            <button type="button" data-lang="ja">JP</button>
          </div>
        </div>
      </div>

      <div class="page-head">
        <div>
          <div class="brand-lockup" style="margin-bottom: 0.55rem">
            <div class="logo-mark">KSC</div>
            <div class="brand-text">
              <strong data-i18n="tomorrowTitle">Lịch làm ngày mai</strong>
              <span id="dateLabel">—</span>
            </div>
          </div>
        </div>
      </div>

      <div id="shiftList"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/schedule.js"></script>
  </body>
</html>
